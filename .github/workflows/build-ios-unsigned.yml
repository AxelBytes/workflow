name: Build unsigned iOS .ipa (sideload)

# Genera un .ipa SIN firmar para instalar con Sideloadly/AltStore usando un
# Apple ID gratuito. No reemplaza un build real de EAS: sirve solo para
# probar la app en un iPhone físico sin pagar la cuenta de Apple Developer.
#
# Cómo usarlo:
#   1. Pusheá este repo a GitHub.
#   2. Andá a la pestaña "Actions" del repo y corré este workflow a mano
#      ("Run workflow"), o esperá a que corra solo si hiciste push a main.
#   3. Cuando termine (15-20 min aprox), bajá el artifact "app-unsigned-ipa".
#   4. Instalalo en el iPhone con Sideloadly (ver guía que te pasó el agente).

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (genera carpeta ios/)
        run: npx expo prebuild --platform ios --no-install

      - name: Patch Podfile para habilitar modular headers
        working-directory: ios
        run: |
          if ! grep -q "use_modular_headers!" Podfile 2>/dev/null; then
            perl -0777 -pe 's/(platform :ios.*\n)/$1use_modular_headers!\n/' -i Podfile || echo "use_modular_headers!" >> Podfile
          fi
          echo "Podfile parcheado:"
          sed -n '1,120p' Podfile

      - name: Pod install
        working-directory: ios
        run: pod install --repo-update

      - name: Detectar workspace y scheme
        id: detect
        working-directory: ios
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1 || true)

          if [ -n "$WORKSPACE" ]; then
            SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | awk '/Schemes:/{flag=1; next} flag && NF {print $1; exit}' || true)
            if [ -z "$SCHEME" ]; then
              echo "::error::No se encontró ningún scheme dentro del workspace $WORKSPACE"
              xcodebuild -workspace "$WORKSPACE" -list || true
              exit 1
            fi
            echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "project=" >> "$GITHUB_OUTPUT"
            echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
            echo "Workspace: $WORKSPACE / Scheme: $SCHEME"
            exit 0
          fi

          PROJECT=$(ls -d *.xcodeproj 2>/dev/null | head -n 1 || true)
          if [ -z "$PROJECT" ]; then
            echo "::error::No se encontró .xcworkspace ni .xcodeproj en ios/ (revisá el paso de expo prebuild)"
            ls -la
            exit 1
          fi

          SCHEME=$(xcodebuild -project "$PROJECT" -list 2>/dev/null | awk '/Schemes:/{flag=1; next} flag && NF {print $1; exit}' || true)
          if [ -z "$SCHEME" ]; then
            echo "::error::No se encontró ningún scheme dentro del proyecto $PROJECT"
            xcodebuild -project "$PROJECT" -list || true
            exit 1
          fi
          echo "workspace=" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT / Scheme: $SCHEME"

      - name: Build sin firma (Release, para dispositivo real)
        working-directory: ios
        run: |
          set -euxo pipefail
          LOG=build-xcode.log

          if [ -n "${{ steps.detect.outputs.workspace }}" ]; then
            BUILD_TARGET=(-workspace "${{ steps.detect.outputs.workspace }}")
          else
            BUILD_TARGET=(-project "${{ steps.detect.outputs.project }}")
          fi

          xcodebuild "${BUILD_TARGET[@]}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee "$LOG" || {
              echo "::error::xcodebuild falló — últimas 200 líneas de $LOG:"
              tail -n 200 "$LOG"
              exit 1
            }

      - name: Subir log de build (para diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/build-xcode.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Empaquetar como .ipa (sin firmar)
        working-directory: ios
        run: |
          set -euo pipefail

          # Buscar el .app en cualquier subcarpeta (Release-iphoneos, etc.)
          APP_PATH=$(find build/Build/Products -name "*.app" -print -quit 2>/dev/null || true)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -type d -name "*.app" -print -quit 2>/dev/null || true)
          fi

          if [ -z "${APP_PATH}" ]; then
            echo "::error::No se encontró ningún .app dentro de build/"
            echo "Listado de build para debug:"
            find build -maxdepth 6 -print -exec ls -la {} \; || true
            if [ -f build-xcode.log ]; then
              echo "Últimas 400 líneas de build-xcode.log:"
              tail -n 400 build-xcode.log || true
            fi
            exit 1
          fi

          echo "App encontrada en: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r ../app-unsigned.ipa Payload

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ipa
          path: app-unsigned.ipa
          retention-days: 14
