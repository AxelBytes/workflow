name: Build unsigned iOS .ipa (sideload)

# Genera un .ipa SIN firmar para instalar con Sideloadly/AltStore usando un
# Apple ID gratuito. No reemplaza un build real de EAS: sirve solo para
# probar la app en un iPhone físico sin pagar la cuenta de Apple Developer.
#
# Cómo usarlo:
#   1. Pusheá este repo a GitHub.
#   2. Andá a la pestaña "Actions" del repo y corré este workflow a mano
#      ("Run workflow"), o esperá a que corra solo si hiciste push a main.
#   3. Cuando termine (15-20 min aprox), bajá el artifact "app-unsigned-ipa".
#   4. Instalalo en el iPhone con Sideloadly (ver guía que te pasó el agente).

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (genera carpeta ios/)
        run: npx expo prebuild --platform ios --no-install

      - name: Patch Podfile (platform >= 14.0 y modular headers)
        working-directory: ios
        run: |
          set -euo pipefail

          # Asegurar platform :ios al menos en 14.0
          if grep -q "^platform :ios" Podfile 2>/dev/null; then
            perl -0777 -pe "s/platform :ios.*\n/platform :ios, '14.0'\n/" -i Podfile
          else
            echo "platform :ios, '14.0'" >> Podfile
          fi

          # Asegurar que exista la línea use_modular_headers!
          if ! grep -q "use_modular_headers!" Podfile 2>/dev/null; then
            perl -0777 -pe 's/(platform :ios.*\n)/$1use_modular_headers!\n/' -i Podfile || echo "use_modular_headers!" >> Podfile
          fi

          # Forzar IPHONEOS_DEPLOYMENT_TARGET = 14.0 en todos los Pods.
          # OJO: el Podfile de Expo ya trae su propio post_install (llama a
          # react_native_post_install). Ruby/CocoaPods solo guarda el último
          # bloque post_install definido, así que en vez de agregar uno nuevo
          # (que pisaría al de Expo) inyectamos el loop DENTRO del existente.
          if ! grep -q "IPHONEOS_DEPLOYMENT_TARGET'\] = '14.0'" Podfile 2>/dev/null; then
            if grep -q "post_install do |installer|" Podfile 2>/dev/null; then
              perl -0777 -pe "s/(post_install do \|installer\|\n)/\$1    installer.pods_project.targets.each do |target|\n      target.build_configurations.each do |config|\n        config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'\n      end\n    end\n/" -i Podfile
            else
              {
                echo ''
                echo 'post_install do |installer|'
                echo '  installer.pods_project.targets.each do |target|'
                echo '    target.build_configurations.each do |config|'
                echo "      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'"
                echo '    end'
                echo '  end'
                echo 'end'
              } >> Podfile
            fi
          fi

          echo "Podfile parcheado:"
          sed -n '1,140p' Podfile

      - name: Pod install
        working-directory: ios
        run: pod install --repo-update

      - name: Forzar IPHONEOS_DEPLOYMENT_TARGET = 14.0 en project.pbxproj
        working-directory: ios
        run: |
          set -euo pipefail
          find . -name "project.pbxproj" -exec sed -i '' \
            -E "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9]+\.[0-9]+/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g" {} \;

      - name: Detectar workspace y scheme
        id: detect
        working-directory: ios
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1 || true)

          if [ -n "$WORKSPACE" ]; then
            SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null | awk '/Schemes:/{flag=1; next} flag && NF {print $1; exit}' || true)
            if [ -z "$SCHEME" ]; then
              echo "::error::No se encontró ningún scheme dentro del workspace $WORKSPACE"
              xcodebuild -workspace "$WORKSPACE" -list || true
              exit 1
            fi

            PRODUCT_TYPE=$(xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -showBuildSettings 2>/dev/null | awk '/PRODUCT_TYPE/ {print $3; exit}')
            if [ "$PRODUCT_TYPE" != "com.apple.product-type.application" ]; then
              echo "::error::El scheme '$SCHEME' no produce una app (PRODUCT_TYPE=$PRODUCT_TYPE)"
              exit 1
            fi

            echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "project=" >> "$GITHUB_OUTPUT"
            echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
            echo "Workspace: $WORKSPACE / Scheme: $SCHEME"
            exit 0
          fi

          PROJECT=$(ls -d *.xcodeproj 2>/dev/null | head -n 1 || true)
          if [ -z "$PROJECT" ]; then
            echo "::error::No se encontró .xcworkspace ni .xcodeproj en ios/ (revisá el paso de expo prebuild)"
            ls -la
            exit 1
          fi

          SCHEME=$(xcodebuild -project "$PROJECT" -list 2>/dev/null | awk '/Schemes:/{flag=1; next} flag && NF {print $1; exit}' || true)
          if [ -z "$SCHEME" ]; then
            echo "::error::No se encontró ningún scheme dentro del proyecto $PROJECT"
            xcodebuild -project "$PROJECT" -list || true
            exit 1
          fi

          PRODUCT_TYPE=$(xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showBuildSettings 2>/dev/null | awk '/PRODUCT_TYPE/ {print $3; exit}')
          if [ "$PRODUCT_TYPE" != "com.apple.product-type.application" ]; then
            echo "::error::El scheme '$SCHEME' no produce una app (PRODUCT_TYPE=$PRODUCT_TYPE)"
            exit 1
          fi

          echo "workspace=" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT / Scheme: $SCHEME"

      - name: Build sin firma (Release, para dispositivo real)
        working-directory: ios
        run: |
          set -euxo pipefail
          LOG=build-xcode.log

          if [ -n "${{ steps.detect.outputs.workspace }}" ]; then
            BUILD_TARGET=(-workspace "${{ steps.detect.outputs.workspace }}")
          else
            BUILD_TARGET=(-project "${{ steps.detect.outputs.project }}")
          fi

          xcodebuild "${BUILD_TARGET[@]}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee "$LOG" || {
              echo "::error::xcodebuild falló — últimas 200 líneas de $LOG:"
              tail -n 200 "$LOG"
              exit 1
            }

      - name: Subir log de build (para diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/build-xcode.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Empaquetar como .ipa (sin firmar)
        working-directory: ios
        run: |
          set -euo pipefail

          SHOW_SETTINGS_ARGS=()
          if [ -n "${{ steps.detect.outputs.workspace }}" ]; then
            SHOW_SETTINGS_ARGS=(-workspace "${{ steps.detect.outputs.workspace }}")
          else
            SHOW_SETTINGS_ARGS=(-project "${{ steps.detect.outputs.project }}")
          fi

          TARGET_BUILD_DIR=$(xcodebuild "${SHOW_SETTINGS_ARGS[@]}" -scheme "${{ steps.detect.outputs.scheme }}" -configuration Release -showBuildSettings 2>/dev/null | awk -F'= ' '/ TARGET_BUILD_DIR/ {print $2; exit}')
          FULL_PRODUCT_NAME=$(xcodebuild "${SHOW_SETTINGS_ARGS[@]}" -scheme "${{ steps.detect.outputs.scheme }}" -configuration Release -showBuildSettings 2>/dev/null | awk -F'= ' '/ FULL_PRODUCT_NAME/ {print $2; exit}')

          APP_PATH=""
          if [ -n "${TARGET_BUILD_DIR:-}" ] && [ -n "${FULL_PRODUCT_NAME:-}" ]; then
            CAND="$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME"
            [ -d "$CAND" ] && APP_PATH="$CAND"
          fi

          # Fallback: buscar el .app en cualquier subcarpeta (Release-iphoneos, etc.)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/Build/Products -type d -name "*.app" -print -quit 2>/dev/null || true)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -type d -name "*.app" -print -quit 2>/dev/null || true)
          fi

          if [ -z "${APP_PATH}" ]; then
            echo "::error::No se encontró ningún .app (ver build-xcode.log)"
            echo "Listado de build para debug:"
            find build -maxdepth 6 -print -exec ls -la {} \; || true
            if [ -f build-xcode.log ]; then
              echo "Últimas 400 líneas de build-xcode.log:"
              tail -n 400 build-xcode.log || true
            fi
            exit 1
          fi

          echo "App encontrada en: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r ../app-unsigned.ipa Payload

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ipa
          path: app-unsigned.ipa
          retention-days: 14
