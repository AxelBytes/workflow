name: Build unsigned iOS .ipa (sideload)

# Genera un .ipa SIN firmar para instalar con Sideloadly/AltStore usando un
# Apple ID gratuito. No reemplaza un build real de EAS: sirve solo para
# probar la app en un iPhone físico sin pagar la cuenta de Apple Developer.
#
# Cómo usarlo:
#   1. Pusheá este repo a GitHub.
#   2. Andá a la pestaña "Actions" del repo y corré este workflow a mano
#      ("Run workflow"), o esperá a que corra solo si hiciste push a main.
#   3. Cuando termine (15-20 min aprox), bajá el artifact "app-unsigned-ipa".
#   4. Instalalo en el iPhone con Sideloadly (ver guía que te pasó el agente).

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (genera carpeta ios/)
        run: npx expo prebuild --platform ios --no-install

      - name: Patch Podfile para habilitar modular headers
        working-directory: ios
        run: |
          if ! grep -q "use_modular_headers!" Podfile 2>/dev/null; then
            perl -0777 -pe 's/(platform :ios.*\n)/$1use_modular_headers!\n/' -i Podfile || echo "use_modular_headers!" >> Podfile
          fi
          echo "Podfile parcheado:"
          sed -n '1,120p' Podfile

      - name: Pod install
        working-directory: ios
        run: pod install --repo-update

      - name: Detectar workspace y scheme
        id: detect
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/{flag=1; next} flag && NF {print $1; exit}')
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Workspace: $WORKSPACE / Scheme: $SCHEME"

      - name: Build sin firma (Release, para dispositivo real)
        working-directory: ios
        run: |
          xcodebuild -workspace "${{ steps.detect.outputs.workspace }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Empaquetar como .ipa (sin firmar)
        working-directory: ios
        run: |
          set -euo pipefail

          # Buscar el .app en cualquier subcarpeta (Release-iphoneos, etc.)
          APP_PATH=$(find build/Build/Products -name "*.app" | head -n 1 || true)

          if [ -z "${APP_PATH}" ]; then
            echo "::error::No se encontró ningún .app dentro de build/Build/Products"
            echo "Listado de build/Build/Products para debug:"
            find build -maxdepth 4 -type d -print -exec ls -la {} \; || true
            echo "Revisá el output del build y del paso de detección de workspace/scheme."
            exit 1
          fi

          echo "App encontrada en: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r ../app-unsigned.ipa Payload

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ipa
          path: app-unsigned.ipa
          retention-days: 14
